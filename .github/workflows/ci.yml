# ---------------------------------------------------------------------------
# Continuous integration for hbtn-devops-pipeline-lab.
#
# HEADS UP: this workflow is DELIBERATELY BROKEN. It ships with three separate
# faults of three different kinds, and repairing them one commit at a time is
# the pipeline-repair task.
#
# Read the run logs in the Actions tab and let them tell you where to look. Do
# not rewrite the file from scratch: the exercise is the diagnosis, not the
# typing. Each fault has its own signature, and fixing one only gets you as far
# as the next.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test: 
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline
          POSTGRES_DB: pipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline -d pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Steps run on the runner host, so the service is reached through its
    # published port on localhost, not through the "postgres" service name.
    env:
      DATABASE_URL: postgres://pipeline:pipeline@localhost:5432/pipeline

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # NodeJS 20 is deprecated, raises a warning of "forced update to Node 24".
          node-version: '24'

      # Caches npm's download cache, not node_modules: `npm ci` still installs
      # the exact tree from the lock file, it only downloads less. A lock-file
      # change produces a new exact key; the prefix still restores the most
      # recent cache for this OS as a starting point.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint the sources
        run: npm run lint

      # One run of the whole suite (unit + integration), so a single JUnit file
      # covers every test instead of the second run overwriting the first.
      - name: Run the test suite
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
        run: npm test -- --reporters=default --reporters=jest-junit

      # always(): the report matters most when the tests have just failed.
      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ./reports/
          retention-days: 7

  build:
    name: Build and publish image
    needs: test
    # Release gate: only a push to main publishes. Pull requests stop after the
    # tests and never produce a package.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Overrides the read-only workflow default for this job only.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The default "docker" driver cannot export the type=gha layer cache;
      # this creates a docker-container builder that can.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          # The commit SHA identifies exactly what was built; latest only
          # follows the most recent release.
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          # Reuse unchanged layers (npm ci, base image) across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Nothing here reads the repository or writes to GitHub: the Render
    # credentials come from repository secrets, not from GITHUB_TOKEN.
    permissions: {}

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}

    steps:
      - name: Check the staging configuration
        run: |
          missing=""
          [ -n "$RENDER_API_KEY" ] || missing="$missing RENDER_API_KEY (secret)"
          [ -n "$RENDER_SERVICE_ID" ] || missing="$missing RENDER_SERVICE_ID (secret)"
          [ -n "$STAGING_URL" ] || missing="$missing STAGING_URL (variable)"
          if [ -n "$missing" ]; then
            echo "::error::Staging is not configured, missing:$missing. See DEPLOY.md."
            exit 1
          fi

      - name: Trigger Render deploy
        id: trigger
        run: |
          response=$(curl -fsS -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          deploy_id=$(printf '%s' "$response" | jq -r '.id // empty' 2>/dev/null || true)
          if [ -z "$deploy_id" ]; then
            echo "::warning::Render returned no deploy id; the endpoint checks below may still reach the previous deploy."
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      # Without this wait, the endpoint checks could succeed against the
      # previous deploy while the new one is still building.
      - name: Wait for the deploy to go live
        if: steps.trigger.outputs.deploy_id != ''
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          max_attempts=40
          for attempt in $(seq 1 "$max_attempts"); do
            status=$(curl -fsS "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" | jq -r '.status // empty')
            echo "attempt ${attempt}/${max_attempts}: deploy ${DEPLOY_ID} is ${status:-unknown}"
            case "$status" in
              live) exit 0 ;;
              "") echo "::error::Unexpected answer from the Render API."; exit 1 ;;
              *failed|canceled|deactivated) echo "::error::Render deploy ended as ${status}."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Render deploy still not live after ${max_attempts} attempts."
          exit 1

      - name: Verify the staging service
        run: |
          max_attempts=20
          for attempt in $(seq 1 "$max_attempts"); do
            health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${STAGING_URL}/health" || true)
            items=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${STAGING_URL}/items" || true)
            echo "attempt ${attempt}/${max_attempts}: /health=${health} /items=${items}"
            if [ "$health" = "200" ] && [ "$items" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Staging did not answer 200 on both /health and /items."
          exit 1
